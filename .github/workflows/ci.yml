name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Format, lint, types, OpenAPI snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check app tests scripts migrations
      - run: ruff check app tests scripts migrations
      - run: mypy app scripts
      - run: python scripts/export_openapi.py --check

  unit:
    name: Unit, API and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit tests/api tests/contract --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration:
    name: PostgreSQL integration tests and migration check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: files_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/files_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/files_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/wait_for_db.py --timeout 60
      - name: Migrations apply, match the models, and roll back cleanly
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - run: pytest tests/integration -m integration

  docker:
    name: Build image and smoke test the container
    runs-on: ubuntu-latest
    needs: [quality, unit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: files
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: secure-file-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root
        run: |
          test "$(docker run --rm secure-file-service:ci id -u)" = "10001"
      - name: Migrate and start the container
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/files \
            secure-file-service:ci sh -c "python scripts/wait_for_db.py --timeout 60 && alembic upgrade head"
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/files \
            -e ENVIRONMENT=development -e PUBLIC_BASE_URL=http://localhost:8080 \
            secure-file-service:ci
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install httpx
      - name: Smoke test
        run: python scripts/smoke_test.py http://localhost:8080 --wait 60
      - name: Container logs
        if: always()
        run: docker logs api || true
